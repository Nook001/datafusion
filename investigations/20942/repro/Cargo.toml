[package]
name = "infralab-distinct-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
datafusion = { path = "../../../datafusion/core", default-features = false, features = ["sql"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
codegen-units = 16
lto = false
debug = "line-tables-only"
strip = false
